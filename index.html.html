<body>
<title>Rotina da Marianne</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<style>
/* Layout: one-column phone app; soft rose-grey ground, white cards, fixed bottom tab bar. Raspberry = progress/perna; teal = bike; amber = braço. */
:root{
  --bg:#F6F3F5; --surface:#FFFFFF; --sunken:#F0EAEE; --ink:#24181F; --muted:#6C5F67; --faint:#968A92; --line:#E5DCE2; --card-line:transparent;
  --accent:#B02E62; --accent-ink:#FFFFFF; --accent-soft:#F8E3EC;
  --leg:#B02E62; --leg-soft:#F8E3EC;
  --bike:#16737A; --bike-soft:#DCEFEF;
  --arm:#A8650C; --arm-soft:#F7EAD5;
  --good:#2B7A4C; --good-soft:#DFF0E5;
  --bar:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(36,24,31,.05), 0 8px 24px -14px rgba(36,24,31,.22);
  --knob:0 1px 3px rgba(36,24,31,.25);
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141013; --surface:#1F191E; --sunken:#2A2228; --ink:#F4EEF2; --muted:#B4A7AF; --faint:#857880; --line:#372D34; --card-line:#2E262C;
    --accent:#EE6E9F; --accent-ink:#2A0E1A; --accent-soft:#3B1D2A;
    --leg:#EE6E9F; --leg-soft:#3B1D2A;
    --bike:#55C2C6; --bike-soft:#173638;
    --arm:#E9A94D; --arm-soft:#3A2B15;
    --good:#62C690; --good-soft:#18352A;
    --bar:rgba(31,25,30,.9);
    --shadow:none; --knob:0 1px 3px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141013; --surface:#1F191E; --sunken:#2A2228; --ink:#F4EEF2; --muted:#B4A7AF; --faint:#857880; --line:#372D34; --card-line:#2E262C;
  --accent:#EE6E9F; --accent-ink:#2A0E1A; --accent-soft:#3B1D2A;
  --leg:#EE6E9F; --leg-soft:#3B1D2A;
  --bike:#55C2C6; --bike-soft:#173638;
  --arm:#E9A94D; --arm-soft:#3A2B15;
  --good:#62C690; --good-soft:#18352A;
  --bar:rgba(31,25,30,.9);
  --shadow:none; --knob:0 1px 3px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,textarea{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px}
.top{padding-block:6px 16px}
.eyebrow,.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--font-display);font-weight:600;font-size:31px;line-height:1.1;margin-top:4px;letter-spacing:-.01em;text-wrap:balance}

.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--card-line);min-width:0;scroll-margin-top:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.h2{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.sub b{color:var(--ink)}
.hint{font-size:12.5px;color:var(--faint);margin-top:8px}
.field{display:flex;flex-direction:column;gap:8px;margin-top:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunken)}
.btn.danger{color:var(--leg);padding:0 6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.linkbtn{font-size:13.5px;color:var(--accent);font-weight:700;padding:6px 4px}

textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;resize:vertical;min-height:88px;line-height:1.4}
textarea::placeholder,input::placeholder{color:var(--faint)}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}

.banner{background:var(--arm-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}
.iconbtn{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.iconbtn:disabled{opacity:.3}
.sw{width:10px;height:10px;border-radius:50%;background:var(--t);display:inline-block;flex:none}

/* Week progress */
.prog{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:center;margin-top:12px}
.ring{width:104px;height:104px;display:block}
.ring-num{font-family:var(--font-display);font-weight:600;font-size:25px;fill:var(--ink)}
.ring-cap{font-size:10.5px;fill:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.split{display:flex;gap:22px}
.big{font-family:var(--font-display);font-weight:600;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.big.rest{color:var(--faint)}
.cap{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
.prog-note{font-size:14px;margin-top:12px;color:var(--muted)}
.prog-note b{color:var(--good)}
.mix{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.mix-i{display:flex;flex-direction:column;gap:6px;min-width:0}
.mix-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;font-weight:700}
.mix-top span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.pips{display:flex;gap:4px}
.pip{flex:1;height:8px;border-radius:4px;background:var(--t-soft)}
.pip.on{background:var(--t)}

/* Day card */
.sess-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sess-title{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15;margin-top:6px;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.miss{background:var(--sunken);color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ty{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;background:var(--sunken);font-weight:700;font-size:15px}
.ty.on{background:var(--t-soft);color:var(--t);box-shadow:inset 0 0 0 2px var(--t)}
.ty:disabled{opacity:.45}
.mark-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:16px;background:var(--sunken);font-weight:700;font-size:17px;transition:background .15s,color .15s}
.mb svg{width:20px;height:20px}
.mb.yes.on{background:var(--t);color:var(--surface)}
.mb.no.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.mb:disabled{opacity:.4}
.tip-line{margin-top:12px;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.tip-line .sw{transform:translateY(-1px)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-mid{text-align:center;min-width:0}
.cal-title{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.2}
.cal-sum{font-size:13.5px;color:var(--muted);margin-top:2px}
.cal-sum b{color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:14px}
.cal-wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.04em;padding-bottom:4px}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 8px;border-radius:12px;min-width:0;border:1.5px solid transparent}
.cal-day .dn{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.cal-day.future .dn{color:var(--faint)}
.cal-day.today .dn{color:var(--accent);font-weight:800}
.cal-day.sel{background:var(--sunken);border-color:var(--line)}
.mark{width:22px;height:22px;display:block}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend svg{width:16px;height:16px}

/* Guide */
.guide-head{display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px}
.guide-head svg{transition:transform .2s;color:var(--muted);flex:none}
.guide-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.rules{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:15px;align-items:baseline}
.rules li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateY(-2px)}

/* Date nav */
.datenav{display:flex;align-items:center;gap:8px}
.datenav .mid{flex:1;text-align:center;min-width:0}
.datenav .d{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.15}
.datenav .s{font-size:13px;color:var(--muted)}

/* Food score */
.score{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.score button{height:54px;display:grid;place-items:center;text-align:center;border-radius:16px;background:var(--sunken);font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.score button.on{background:var(--accent);color:var(--accent-ink)}
.score-big{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.score-big span{font-size:16px;color:var(--muted)}
.score-cap{margin-top:12px;font-size:14px;color:var(--muted);min-height:20px}
.score-cap b{color:var(--ink)}
.reasons{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.reason{border-radius:16px;background:var(--sunken)}
.reason>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;gap:12px;font-weight:600;min-height:54px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:var(--knob);transition:transform .2s}
.reason.on .switch{background:var(--accent)}
.reason.on .switch::after{transform:translateX(18px)}
.reason .more{padding:0 12px 12px}
.reason textarea{background:var(--surface);min-height:74px}

/* Diary */
.weight{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.weight input{font-family:var(--font-display);font-size:42px;font-weight:600;width:calc(var(--n,4) * .6em + 6px);min-width:2.2em;border:0;border-bottom:2px solid var(--line);background:transparent;padding:0 0 2px;border-radius:0;font-variant-numeric:tabular-nums}
.weight input:focus{outline:none;border-bottom-color:var(--accent)}
.weight .unit{font-size:18px;color:var(--muted);font-weight:600}
.w-info{font-size:14px;color:var(--muted);margin-top:8px}
.w-info b{color:var(--ink)}
.opts{display:grid;gap:6px}
.opts.c5{grid-template-columns:repeat(5,1fr)}
.opts.c4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 2px;border-radius:14px;background:var(--sunken);font-size:12px;font-weight:600;text-align:center;min-width:0;min-height:52px;line-height:1.15}
.opt svg{width:30px;height:30px;color:var(--muted)}
.opt .num{font-family:var(--font-display);font-size:20px;font-weight:600}
.opt.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.opt.on svg{color:var(--accent)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:-2px}

/* Dash */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--card-line);border-radius:18px;padding:14px;min-width:0;box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--font-display);font-size:30px;font-weight:600;margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:14px;color:var(--muted);font-family:var(--font-body);font-weight:600}
.tile .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.stats{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.stat-row{display:grid;grid-template-columns:72px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.stat-row .nm{display:flex;align-items:center;gap:7px;font-weight:700}
.stat-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.stat-row .n b{color:var(--ink)}
.hbar{height:10px;border-radius:5px;background:var(--t-soft);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--t);border-radius:5px}
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .lbl-strong{fill:var(--ink);font-weight:700;font-size:12px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.empty{margin-top:12px;padding:18px;border-radius:16px;background:var(--sunken);color:var(--muted);font-size:14px;text-align:center}
.pat{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.pat-row{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 28px;gap:10px;align-items:center;font-size:14px}
.pat-bar{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.pat-bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.pat-row .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#copyFallback{margin-top:10px;min-height:120px;font-size:13px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--faint)}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-16px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;transition:opacity .25s,transform .25s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){
  .prog{grid-template-columns:90px 1fr;gap:14px}
  .ring{width:90px;height:90px}
  .big{font-size:30px}
  .tile .v{font-size:25px}
  .cal-day .dn{font-size:14px}
  .ty{font-size:14px;gap:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var KEY = 'rotina-marianne-v1';
var TABS = ['treino','comida','diario','dash'];
var WD_LONG = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var WD_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MON_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

var TYPE_IDS = ['perna','braco','bike'];
var TYPES = {
  perna: {label:'Perna', title:'Leg day', color:'var(--leg)',  soft:'var(--leg-soft)',  goal:2, tip:'Sem aeróbico hoje e sem ir até a falha.'},
  braco: {label:'Braço', title:'Treino de braço', color:'var(--arm)', soft:'var(--arm-soft)', goal:1, tip:'Pesos leves a moderados, sem ir até a falha.'},
  bike:  {label:'Bike',  title:'Bike', color:'var(--bike)', soft:'var(--bike-soft)', goal:2, tip:'HIIT curto ou ritmo moderado.'}
};
/* plano: índice do dia 0 = segunda ... 6 = domingo. Braço na sexta (ou sábado). */
var PLAN = {0:'perna', 2:'bike', 3:'perna', 4:'braco', 6:'bike'};
var TAGS = [
  {id:'ansiedade', label:'Comi por ansiedade', ph:'O que comeu? O que estava acontecendo?'},
  {id:'doce',      label:'Comi doce por emoção', ph:'Qual emoção? Qual doce?'},
  {id:'plano',     label:'Não segui o plano', ph:'Por quê? Escreva livremente.'},
  {id:'beliscou',  label:'Belisquei fora de hora', ph:'O quê e em que horário?'},
  {id:'pulou',     label:'Pulei refeição', ph:'Qual refeição e por quê?'},
  {id:'fora',      label:'Comi fora ou em evento', ph:'Onde? O que escolheu?'}
];
var MOODS = [ {v:1, l:'Pra baixo'}, {v:2, l:'Cansada'}, {v:3, l:'Normal'}, {v:4, l:'Bem'}, {v:5, l:'Muito bem'} ];
var LEGS = [ {v:0, l:'Leves'}, {v:1, l:'Normais'}, {v:2, l:'Pesadas'}, {v:3, l:'Doloridas'} ];
var RULES = [
  'Perna 2 vezes por semana, com 72 horas de descanso entre os treinos.',
  'Não ir até a falha: parar cada série sabendo que ainda faria mais 2 repetições.',
  'Aeróbico: HIIT curto, caminhada ou bike moderada.',
  'Não fazer aeróbico no mesmo dia do treino de perna.',
  'Pesos leves a moderados, para fortalecer pernas e glúteos.',
  'Baixo impacto e progressão gradual, para não sobrecarregar as articulações.'
];

var ICON = {
  left:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
};

/* ---------- dates ---------- */
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function today(){ var n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function wi(d){ return (d.getDay()+6)%7; }
function mondayOf(d){ return addDays(d, -wi(d)); }
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function fmtShort(d){ return d.getDate()+' '+MON_SHORT[d.getMonth()]; }
function fmtDM(d){ return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function fmtNum(v, dec){ if(v==null||!isFinite(v)) return '–'; var s = dec!=null ? v.toFixed(dec) : String(Math.round(v*10)/10); return s.replace('.',','); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- storage ---------- */
var storageOK = true;
try { localStorage.setItem('__rt','1'); localStorage.removeItem('__rt'); } catch(e){ storageOK = false; }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch(e){}

function fresh(){ return {v:3, created:iso(today()), train:{}, food:{}, check:{}}; }
function normalize(d){
  if(!d || typeof d!=='object') return fresh();
  d.created = d.created || iso(today());
  d.train = d.train || {}; d.food = d.food || {}; d.check = d.check || {};
  if(d.weeks){ /* versões anteriores: treino por semana */
    Object.keys(d.weeks).forEach(function(wk){
      var w=d.weeks[wk]||{}, s=w.s||{};
      var map={perna1:[0,'perna'], bike1:[2,'bike'], perna2:[3,'perna'], braco:[w.armDay===5?5:4,'braco'], bike2:[6,'bike']};
      Object.keys(s).forEach(function(id){
        var st=s[id], m=map[id]; if(!st||!m) return;
        var done = st.done!=null ? st.done : (st.c && Object.keys(st.c).some(function(k){ return st.c[k]; }) ? true : null);
        if(done==null && !st.note) return;
        var k=iso(addDays(parse(wk), m[0])); if(d.train[k]) return;
        var e={type:m[1]}; if(done!=null) e.done=done; if(st.note) e.note=st.note; d.train[k]=e;
      });
    });
  }
  delete d.weeks; delete d.plan; delete d.armDefault;
  d.v = 3;
  return d;
}
function load(){
  try { var raw = localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw)); } catch(e){}
  return fresh();
}
var store = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ if(storageOK){ storageOK=false; render(); } }
}
var saveTimer = null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') save(); });

/* ---------- model helpers ---------- */
function planned(ds){ return PLAN[wi(parse(ds))] || null; }
function train(ds, create){ var e=store.train[ds]; if(!e){ e={}; if(create) store.train[ds]=e; } return e; }
function dayInfo(ds){
  var e=store.train[ds]||{}, p=planned(ds), type=e.type||p;
  return {ds:ds, planned:p, type:type, done:e.done===true, missed:e.done===false, note:e.note||''};
}
/* contagem de treinos feitos por tipo entre duas datas (inclusive) */
function countDone(fromIso, toIso){
  var c={perna:0, braco:0, bike:0, total:0};
  Object.keys(store.train).forEach(function(k){
    if(k<fromIso||k>toIso) return; var e=store.train[k];
    if(e.done===true && e.type && c[e.type]!=null){ c[e.type]++; c.total++; }
  });
  return c;
}
function countPlanned(fromIso, toIso){
  var c={perna:0, braco:0, bike:0, total:0};
  for(var d=parse(fromIso); iso(d)<=toIso; d=addDays(d,1)){ var p=PLAN[wi(d)]; if(p){ c[p]++; c.total++; } }
  return c;
}
/* semana: meta de 2 perna + 2 bike + 1 braço */
function weekStats(wk){
  var c=countDone(wk, iso(addDays(parse(wk),6))), got=0;
  TYPE_IDS.forEach(function(t){ got+=Math.min(c[t], TYPES[t].goal); });
  return {c:c, got:got, pct:got/5};
}
function food(ds, create){ var f=store.food[ds]; if(!f){ f={}; if(create) store.food[ds]=f; } if(!f.tags) f.tags={}; return f; }
function chk(ds, create){ var c=store.check[ds]; if(!c){ c={}; if(create) store.check[ds]=c; } return c; }

/* ---------- ui state ---------- */
var ui = { tab:'treino', sel:iso(today()), calMonth:iso(monthStart(today())), cursor:iso(today()), guide:false, wipeArm:false, restoreArm:false };

/* ---------- toast ---------- */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------- pieces ---------- */
function banner(){
  return storageOK ? '' : '<div class="banner"><b>Atenção:</b> este navegador não está guardando os dados. Abra no Safari fora da navegação privada e adicione à Tela de Início.</div>';
}
var MARK_DONE = function(color){ return '<svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="'+color+'"/><path d="M6.6 11.3l3 3 5.8-6" fill="none" stroke="var(--surface)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'; };
var MARK_MISS = '<svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M8 8l6 6M14 8l-6 6" stroke="var(--faint)" stroke-width="2" stroke-linecap="round"/></svg>';
function markSvg(info, past){
  if(info.done && info.type) return MARK_DONE(TYPES[info.type].color);
  if(info.missed) return MARK_MISS;
  if(!info.type) return '<span class="mark" aria-hidden="true"></span>';
  var T=TYPES[info.type];
  return '<svg class="mark" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="'+T.soft+'" stroke="'+T.color+'" stroke-width="2"'+(past?' stroke-dasharray="3 2.6" opacity="0.6"':'')+'/></svg>';
}
function dateNav(){
  var d = parse(ui.cursor), t = today();
  var isT = ui.cursor===iso(t), isY = ui.cursor===iso(addDays(t,-1));
  var big = isT ? 'Hoje' : isY ? 'Ontem' : WD_LONG[d.getDay()];
  var small = (isT||isY ? WD_LONG[d.getDay()]+', ' : '') + d.getDate()+' de '+MONTHS[d.getMonth()];
  return '<div class="datenav">'+
    '<button class="iconbtn" data-act="date-prev" aria-label="Dia anterior">'+ICON.left+'</button>'+
    '<div class="mid"><div class="d">'+big+'</div><div class="s">'+small+'</div></div>'+
    '<button class="iconbtn" data-act="date-next" aria-label="Próximo dia"'+(isT?' disabled':'')+'>'+ICON.right+'</button>'+
  '</div>';
}
function face(v){
  var k = (v-3)*1.9;
  var eyes = v===2 ? '<path d="M8.2 10h2.2M13.6 10h2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' : '<circle cx="9.3" cy="10" r="1.15" fill="currentColor"/><circle cx="14.7" cy="10" r="1.15" fill="currentColor"/>';
  return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke="currentColor" stroke-width="1.6"/>'+eyes+
    '<path d="M8.2 '+(15-k/2).toFixed(1)+' Q12 '+(15+k).toFixed(1)+' 15.8 '+(15-k/2).toFixed(1)+'" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
}

/* ---------- charts ---------- */
function barPath(x,y,w,h,r){
  if(h<=0) return '';
  r = Math.min(r, w/2, h);
  return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z';
}
/* data: [{label, v (number|null), tip, dim, sel, act, date}] */
function barChart(data, opt){
  var W=340, H=opt.h||150, ml=30, mr=6, mt=12, mb=24;
  var n=data.length, bw=(W-ml-mr)/n, w=Math.min(26, bw*0.62);
  var Y=function(v){ return mt+(1-v/opt.max)*(H-mt-mb); };
  var base=Y(0);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria)+'">';
  opt.ticks.forEach(function(t){
    var y=Y(t).toFixed(1);
    s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"'+(t===0?'':' stroke-dasharray="2 4"')+'/>';
    s+='<text x="'+(ml-6)+'" y="'+y+'" text-anchor="end" dominant-baseline="central">'+(opt.tickFmt?opt.tickFmt(t):t)+'</text>';
  });
  data.forEach(function(d,i){
    var x=ml+i*bw+(bw-w)/2;
    if(d.v!=null){
      var y=Y(d.v);

    } else {

      (d.tip?' data-tip="'+esc(d.tip)+'" data-tx="'+(ml+i*bw+bw/2).toFixed(1)+'" data-ty="'+ty.toFixed(1)+'" data-w="'+W+'"':'')+
      (d.act?' data-act="'+d.act+'" data-date="'+d.date+'" style="cursor:pointer"':'')+'/>';

}
function lineChart(pts){
  var W=340, H=180, ml=36, mr=46, mt=16, mb=26;
  var x0=pts[0].t, x1=pts[pts.length-1].t; if(x1===x0){ x0-=3*864e5; x1+=3*864e5; }
  var vs=pts.map(function(p){return p.v;}); var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  var range=Math.max(hi-lo, 1); var step = range<=2?0.5: range<=4?1: range<=10?2: 5;
  lo=Math.floor((lo-step*0.5)/step)*step; hi=Math.ceil((hi+step*0.5)/step)*step;
  while((hi-lo)/step>4){ step*=2; lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step; }
  var X=function(t){ return ml+(t-x0)/(x1-x0)*(W-ml-mr); };
  var Y=function(v){ return mt+(hi-v)/(hi-lo)*(H-mt-mb); };
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Peso ao longo do tempo">';
  for(var v=lo; v<=hi+1e-9; v+=step){
    var y=Y(v).toFixed(1);
    s+='<line x1="'+ml+'" x2="'+(W-mr+8)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"'+(Math.abs(v-lo)<1e-9?'':' stroke-dasharray="2 4"')+'/>';
    s+='<text x="'+(ml-6)+'" y="'+y+'" text-anchor="end" dominant-baseline="central">'+fmtNum(v, step<1?1:0)+'</text>';
  }
  var line='', area='';
  pts.forEach(function(p,i){ var px=X(p.t).toFixed(1), py=Y(p.v).toFixed(1); line+=(i?'L':'M')+px+','+py; });
  area = line + 'L'+X(pts[pts.length-1].t).toFixed(1)+','+Y(lo).toFixed(1)+'L'+X(pts[0].t).toFixed(1)+','+Y(lo).toFixed(1)+'Z';
  if(pts.length>1){
    s+='<path d="'+area+'" fill="var(--accent-soft)" opacity="0.7"/>';
    s+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){
    var px=X(p.t), py=Y(p.v), last=i===pts.length-1;
    if(last || pts.length<=20) s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(last?5:4)+'" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
    s+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="14" fill="transparent" data-tip="'+esc(fmtNum(p.v,1)+' kg · '+fmtShort(new Date(p.t)))+'" data-tx="'+px.toFixed(1)+'" data-ty="'+(py-6).toFixed(1)+'" data-w="'+W+'"/>';
  });
  var lp=pts[pts.length-1];
  s+='<text x="'+(X(lp.t)+10).toFixed(1)+'" y="'+Y(lp.v).toFixed(1)+'" dominant-baseline="central" class="lbl-strong">'+fmtNum(lp.v,1)+'</text>';
  s+='<text x="'+ml+'" y="'+(H-6)+'" text-anchor="start">'+fmtShort(new Date(pts[0].t))+'</text>';
  if(pts.length>1) s+='<text x="'+(W-mr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtShort(new Date(lp.t))+'</text>';
  return s+'</svg>';
}

  var wDelta = inWin.length>=2 ? inWin[inWin.length-1].v - inWin[0].v : null;

  h+='<div class="tiles">'+
    '<div class="tile"><div class="k">Esta semana</div><div class="v">'+Math.round(ws.pct*100)+'<small>%</small></div><div class="d">'+ws.got+' de 5 treinos da meta</div></div>'+

  '</div>';

  h+='</section>';

  // semanas
  var startMon = mondayOf(parse(store.created)), weeks=[];
  for(var j=7;j>=0;j--){
    var m=addDays(mondayOf(t), -7*j); if(m<startMon) continue;
    var s=weekStats(iso(m)), p2=Math.round(s.pct*100);
    weeks.push({label:fmtDM(m), v:p2, dim:j===0, tip:'Semana de '+fmtShort(m)+': '+s.got+' de 5 ('+p2+'%)'+(j===0?', em andamento':'')});
  }
  var full=weeks.filter(function(w,ix){ return ix<weeks.length-1 && w.v>=100; }).length;
  h+='<section class="card"><div class="card-head"><h2 class="h2">Semanas</h2><span class="sub" style="margin:0">% da meta</span></div>'+
    '<div class="chart">'+barChart(weeks,{max:100, ticks:[0,50,100], tickFmt:function(v){return v+'%';}, aria:'Percentual da meta de treinos por semana'})+'</div>'+
    '<p class="hint">'+(weeks.length>1?full+' '+(full===1?'semana completa':'semanas completas')+' nas últimas '+(weeks.length-1)+'. ':'')+'A barra mais clara é a semana atual.</p></section>';

  // alimentação
  var fd=[], any=false;
  for(var q=13;q>=0;q--){
    var dd=addDays(t,-q), kk=iso(dd), s2=store.food[kk]&&store.food[kk].score;
    if(s2) any=true;
    fd.push({label:String(dd.getDate()), v:s2||null, tip:WD_SHORT[dd.getDay()]+' '+fmtShort(dd)+': '+(s2?'nota '+s2:'sem nota')});
  }
  h+='<section class="card"><div class="card-head"><h2 class="h2">Alimentação</h2><span class="sub" style="margin:0">14 dias</span></div>';
  if(any){
    h+='<p class="sub" style="margin-top:6px">Média 30 dias <b>'+fmtNum(f30/c30,1)+'</b> · <b>'+good30+'</b> de '+c30+' dias com nota 8 ou mais</p>'+
      '<div class="chart">'+barChart(fd,{max:10, ticks:[0,5,10], aria:'Nota da alimentação nos últimos 14 dias'})+'</div>';
  } else h+='<div class="empty">Dê a primeira nota na aba Alimentação.</div>';
  h+='</section>';

  // padrões
  var from=iso(addDays(t,-29)), counts={}, days=0;
  TAGS.forEach(function(tg){ counts[tg.id]=0; });
  Object.keys(store.food).forEach(function(k){
    if(k<from||k>tIso) return; var f=store.food[k]; var has=false;
    TAGS.forEach(function(tg){ if(f.tags&&f.tags[tg.id]&&f.tags[tg.id].on){ counts[tg.id]++; has=true; } });
    if(f.score||has) days++;
  });
  var mx=Math.max.apply(null, TAGS.map(function(tg){ return counts[tg.id]; }).concat([1]));
  h+='<section class="card"><div class="card-head"><h2 class="h2">O que mais acontece</h2><span class="sub" style="margin:0">30 dias</span></div>';
  if(days){
    h+='<div class="pat">';
    TAGS.forEach(function(tg){
      h+='<div class="pat-row"><span>'+tg.label+'</span><span class="pat-bar"><i style="width:'+(counts[tg.id]/mx*100).toFixed(1)+'%"></i></span><span class="n">'+counts[tg.id]+'</span></div>';
    });
    h+='</div><p class="hint">Número de dias em que cada situação foi marcada.</p>';
  } else h+='<div class="empty">Aqui aparece quantas vezes cada situação aconteceu, como comer por ansiedade.</div>';
  h+='</section>';

  // peso
  var wp = wpts.filter(function(p){ return p.k>=iso(addDays(t,-120)); });
  h+='<section class="card"><div class="card-head"><h2 class="h2">Peso</h2><span class="sub" style="margin:0">últimos 4 meses</span></div>'+
    (wp.length>=2 ? '<div class="chart">'+lineChart(wp)+'</div>' : '<div class="empty">O gráfico aparece a partir de 2 pesagens. Registre o peso na aba Diário.</div>')+'</section>';

  // dados
  h+='<section class="card"><h2 class="h2">Seus dados</h2>'+
    '<p class="sub" style="margin-top:6px">Tudo fica salvo neste aparelho. A planilha cola direto no Google Planilhas, Excel ou WhatsApp para analisar.</p>'+
    '<div class="btns"><button class="btn primary" data-act="copy-tsv">Copiar planilha</button><button class="btn ghost" data-act="copy-json">Copiar backup</button></div>'+
    '<textarea id="copyFallback" readonly hidden aria-label="Texto para copiar"></textarea>'+
    '<div class="field"><label class="label" for="restoreText">Restaurar backup</label>'+
    '<textarea id="restoreText" placeholder="Cole aqui um backup copiado antes" style="min-height:70px"></textarea>'+
    '<div class="row-actions"><button class="btn ghost" data-act="restore">'+(ui.restoreArm?'Toque de novo para substituir':'Restaurar')+'</button>'+
    '<button class="btn danger" data-act="wipe">'+(ui.wipeArm?'Toque de novo para apagar tudo':'Apagar todos os dados')+'</button></div></div>'+
  '</section>';
  return h;
}

/* ---------- export ---------- */
function clean(s){ return String(s==null?'':s).replace(/[\t\r\n]+/g,' ').trim(); }
function buildTSV(){
  var dates={}, tIso=iso(today());
  [store.food, store.check, store.train].forEach(function(o){ Object.keys(o).forEach(function(k){ dates[k]=1; }); });
  var head=['data','dia','treino_previsto','treino_tipo','treino','obs_treino','nota_alimentacao'];
  TAGS.forEach(function(tg){ head.push(tg.id, tg.id+'_texto'); });
  head.push('anotacoes_alimentacao','peso_kg','humor','energia_1a5','pernas','notas_diario');
  var rows=[head.join('\t')];
  Object.keys(dates).sort().forEach(function(k){
    if(k>tIso) return;
    var d=parse(k), info=dayInfo(k), e=store.train[k]||{};
    var f=store.food[k]||{}, c=store.check[k]||{}, tags=f.tags||{};
    var r=[k, WD_SHORT[d.getDay()], info.planned?TYPES[info.planned].label:'Descanso', e.type?TYPES[e.type].label:'', info.done?'fiz':info.missed?'não fiz':'', clean(e.note), f.score||''];
    TAGS.forEach(function(tg){ var x=tags[tg.id]; r.push(x&&x.on?'sim':'', x&&x.on?clean(x.text):''); });
    var mood=MOODS.filter(function(m){ return m.v===c.mood; })[0], legs=LEGS.filter(function(m){ return m.v===c.legs; })[0];
    r.push(clean(f.note), c.w?fmtNum(c.w,1):'', mood?mood.l:'', c.energy||'', legs?legs.l:'', clean(c.note));
    rows.push(r.join('\t'));
  });
  return rows.join('\n');
}
function copyText(txt, okMsg){
  var fb=document.getElementById('copyFallback');
  function fallback(){
    if(!fb) return;
    fb.hidden=false; fb.value=txt; fb.focus(); fb.select();
    try{ fb.setSelectionRange(0, txt.length); }catch(e){}
    toast('Texto selecionado. Toque e segure para copiar.');
  }
  try{
    if(!navigator.clipboard || !navigator.clipboard.writeText){ fallback(); return; }
    navigator.clipboard.writeText(txt).then(function(){ if(fb) fb.hidden=true; toast(okMsg); }, fallback);
  }catch(e){ fallback(); }
}

/* ---------- actions ---------- */
function shiftMonth(n){ var m=parse(ui.calMonth); ui.calMonth=iso(new Date(m.getFullYear(), m.getMonth()+n, 1)); }
function tidy(ds){ var e=store.train[ds]; if(e && e.done==null && !e.note && (!e.type || e.type===planned(ds))) delete store.train[ds]; }
function act(a, ds){
  switch(a){
    case 'tab': go(ds.tab); return;
    case 'sel': {
      ui.sel=ds.date; render();
      var dc=document.getElementById('dayCard');
      if(dc && dc.scrollIntoView){ var rm=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; dc.scrollIntoView({behavior:rm?'auto':'smooth', block:'start'}); }
      return;
    }
    case 'cal-prev': shiftMonth(-1); break;
    case 'cal-next': shiftMonth(1); break;
    case 'go-today': ui.sel=iso(today()); ui.calMonth=iso(monthStart(today())); break;
    case 'type': {
      if(ui.sel>iso(today())) break;
      var e=train(ui.sel,true), cur=e.type||planned(ui.sel);
      if(cur===ds.v && !planned(ui.sel)){ delete e.type; delete e.done; }  /* descanso: tocar de novo desfaz */
      else e.type=ds.v;
      tidy(ui.sel); save(); break;
    }
    case 'mark': {
      if(ui.sel>iso(today())) break;
      var info=dayInfo(ui.sel); if(!info.type){ toast('Escolha Perna, Braço ou Bike'); return; }
      var wk=iso(mondayOf(parse(ui.sel))), before=weekStats(wk).pct;
      var e2=train(ui.sel,true), v=ds.v==='1';
      e2.type=info.type;
      if(e2.done===v) delete e2.done; else e2.done=v;
      tidy(ui.sel); save();
      if(e2.done===true){
        if(before<1 && weekStats(wk).pct>=1) toast('Semana 100% feita. Parabéns, Marianne!');
        else toast(TYPES[info.type].label+' marcado. Mandou bem!');
      }
      break;
    }
    case 'guide': ui.guide=!ui.guide; break;
    case 'date-prev': ui.cursor=iso(addDays(parse(ui.cursor),-1)); break;
    case 'date-next': if(ui.cursor<iso(today())) ui.cursor=iso(addDays(parse(ui.cursor),1)); break;
    case 'date-go': if(ds.date && ds.date<=iso(today())) ui.cursor=ds.date; break;
    case 'score': { var f=food(ui.cursor,true), sv=+ds.v; if(f.score===sv) delete f.score; else f.score=sv; save(); break; }
    case 'tag': { var f2=food(ui.cursor,true); var tg=f2.tags[ds.tag]=f2.tags[ds.tag]||{}; tg.on=!tg.on; save(); break; }
    case 'mood': case 'energy': case 'legs': { var c=chk(ui.cursor,true), cv=+ds.v; if(c[a]===cv) delete c[a]; else c[a]=cv; save(); break; }
    case 'copy-tsv': copyText(buildTSV(), 'Planilha copiada. Cole no Google Planilhas ou no WhatsApp.'); return;
    case 'copy-json': copyText(JSON.stringify(store), 'Backup copiado. Guarde em um lugar seguro.'); return;
    case 'restore': {
      var txt=(document.getElementById('restoreText')||{}).value||'';
      var data=null; try{ data=JSON.parse(txt); }catch(err){}
      if(!data || !data.food || !(data.train||data.weeks)){ ui.restoreArm=false; toast('Não reconheci o backup. Cole o texto completo copiado em "Copiar backup".'); return; }
      if(!ui.restoreArm){ ui.restoreArm=true; break; }
      store=normalize(data); ui.restoreArm=false; save(); toast('Backup restaurado'); break;
    }
    case 'wipe': {
      if(!ui.wipeArm){ ui.wipeArm=true; setTimeout(function(){ if(ui.wipeArm){ ui.wipeArm=false; if(ui.tab==='dash') render(); } }, 5000); break; }
      store=fresh(); ui.wipeArm=false; save(); toast('Dados apagados'); break;
    }
  }
  render();
}

document.addEventListener('click', function(e){
  var tipEl=e.target.closest('[data-tip]');
  document.querySelectorAll('.tip').forEach(function(t){ t.remove(); });
  if(tipEl) showTip(tipEl);
  var b=e.target.closest('[data-act]');
  if(b && !b.disabled) act(b.getAttribute('data-act'), b.dataset);
});
document.addEventListener('pointerover', function(e){
  if(e.pointerType!=='mouse') return;
  var m=e.target.closest && e.target.closest('[data-tip]');
  if(m){ document.querySelectorAll('.tip').forEach(function(t){ t.remove(); }); showTip(m); }
});
document.addEventListener('pointerout', function(e){
  if(e.pointerType!=='mouse') return;
  var m=e.target.closest && e.target.closest('[data-tip]');
  if(m && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]'))) document.querySelectorAll('.tip').forEach(function(t){ t.remove(); });
});
function showTip(m){
  var wrap=m.closest('.chart'); if(!wrap) return;
  var tip=document.createElement('div'); tip.className='tip'; tip.textContent=m.getAttribute('data-tip'); wrap.appendChild(tip);
  var W=+m.getAttribute('data-w')||340, sc=wrap.clientWidth/W;
  var x=(+m.getAttribute('data-tx'))*sc, y=(+m.getAttribute('data-ty'))*sc-6;
  var half=tip.offsetWidth/2; x=Math.max(half, Math.min(wrap.clientWidth-half, x));
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

document.addEventListener('input', function(e){
  var el=e.target, b=el.getAttribute && el.getAttribute('data-bind'); if(!b) return;
  var v=el.value;
  switch(b){
    case 'train-note': { var en=train(ui.sel,true); en.note=v; if(!en.type) en.type=dayInfo(ui.sel).type; break; }
    case 'tag-text': { var f=food(ui.cursor,true); f.tags[el.dataset.tag]=f.tags[el.dataset.tag]||{on:true}; f.tags[el.dataset.tag].text=v; break; }
    case 'food-note': food(ui.cursor,true).note=v; break;
    case 'diary-note': chk(ui.cursor,true).note=v; break;
    case 'weight': {
      var c=chk(ui.cursor,true), n=parseFloat(v.replace(',','.'));
      if(isFinite(n) && n>=25 && n<=350) c.w=Math.round(n*10)/10; else delete c.w;
      el.style.setProperty('--n', Math.max(4, v.length));
      var info=document.getElementById('weightInfo'); if(info) info.innerHTML=weightInfo(ui.cursor);
      break;
    }
  }
  saveSoon();
});

/* ---------- render & routing ---------- */
var RENDER = {treino:renderTreino, comida:renderComida, diario:renderDiario, dash:renderDash};
function render(){
  TABS.forEach(function(k){
    var v=document.getElementById('view-'+k); v.hidden = k!==ui.tab;
    var tb=document.getElementById('tab-'+k); tb.classList.toggle('on', k===ui.tab); tb.setAttribute('aria-current', k===ui.tab?'page':'false');
  });
  document.getElementById('view-'+ui.tab).innerHTML = RENDER[ui.tab]();
  var t=today(), hr=new Date().getHours();
  document.getElementById('hdrDate').textContent = WD_LONG[t.getDay()]+', '+t.getDate()+' de '+MONTHS[t.getMonth()];
  document.getElementById('hdrTitle').textContent = (hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite')+', Marianne';
}
function go(tab){
  if(TABS.indexOf(tab)<0) tab='treino';
  ui.tab=tab; ui.wipeArm=false; ui.restoreArm=false;
  if(tab==='comida'||tab==='diario'){ if(ui.cursor>iso(today())) ui.cursor=iso(today()); }
  try{ if(location.hash!=='#'+tab) location.hash=tab; }catch(e){}
  render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', function(){
  var h=location.hash.replace('#','');
  if(TABS.indexOf(h)>=0 && h!==ui.tab){ ui.tab=h; render(); window.scrollTo(0,0); }
});
var startTab = (location.hash||'').replace('#','');
ui.tab = TABS.indexOf(startTab)>=0 ? startTab : 'treino';
render();
})();
</script>
